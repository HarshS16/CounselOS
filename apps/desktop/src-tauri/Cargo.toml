[package]
name = "counselos-desktop"
version = "1.0.0"
description = "CounselOS - Private Legal Evidence Analysis"
authors = ["CounselOS"]
edition = "2021"

[lib]
name = "counselos_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
